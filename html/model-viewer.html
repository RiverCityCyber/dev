<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Dashboard Assembly — 3D Preview</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
    ></script>
    <style>
      :root {
        --vfd-amber: #ffb000;
        --vfd-amber-dim: #7a5200;
        --bg-dark: #0a0a0a;
        --bezel: #1c1c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-dark);
        font-family: "Courier New", monospace;
        color: var(--vfd-amber);
      }

      .console {
        background: var(--bezel);
        border: 2px solid #333;
        border-radius: 8px;
        padding: 24px;
        box-shadow:
          0 0 40px rgba(255, 176, 0, 0.08),
          inset 0 0 20px rgba(0, 0, 0, 0.6);
        max-width: 900px;
        width: 100%;
      }

      h1 {
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin: 0 0 4px;
        text-shadow: 0 0 8px var(--vfd-amber);
      }

      p.subtitle {
        font-size: 11px;
        color: var(--vfd-amber-dim);
        margin: 0 0 16px;
        letter-spacing: 1px;
      }

      model-viewer {
        width: 100%;
        height: 500px;
        background: #050505;
        border: 1px solid #333;
        border-radius: 4px;
        --poster-color: transparent;
      }

      .hint {
        font-size: 10px;
        color: var(--vfd-amber-dim);
        margin-top: 12px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="console">
      <h1>▍ Assembly Preview</h1>
      <p class="subtitle">
        Raspberry Pi 5 + Waveshare Touchscreen — drag to rotate, scroll to zoom
      </p>

      <model-viewer
        src="pacura_v1.gltf"
        alt="3D model of Raspberry Pi 5 and Waveshare touchscreen assembly"
        camera-controls
        auto-rotate
        auto-rotate-delay="1000"
        rotation-per-second="20deg"
        shadow-intensity="1"
        exposure="0.9"
        camera-orbit="25deg 75deg auto"
        min-camera-orbit="auto auto 5%"
        max-camera-orbit="auto auto 200%"
      >
      </model-viewer>

      <p class="hint">// drag = rotate · scroll = zoom · shift+drag = pan</p>
    </div>
  </body>
</html>
